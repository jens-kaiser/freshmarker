image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - deploy
  
cache:
  paths:
    - .m2/repository/
    - target/

maven-build:
  stage: build
  script:
    - dir src/main/ccc/FreshMarker
    - mvn -Dmaven.javadoc.skip=true clean package -B
    - cat target/site/jacoco/index.html
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - target/surefire-reports/*
    paths:
      - target/*.jar
      - target/site/jacoco/*
    expire_in: 1 week

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

sonarcloud-check:
  stage: deploy
  image:  maven:3.9-eclipse-temurin-21
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn package sonar:sonar -Dsonar.projectKey=schegge_freshmarker
  only:
    - merge_requests
    - master
    - develop

pages:
  stage: deploy
  dependencies:
    - maven-build
  script:
   - mkdir public
   - mkdir public/reports
   - mv target/generated-docs/* public
   - cp public/manual.html public/index.html
   - mv target/surefire-reports/* public/reports
   - mv target/site/jacoco/* public/reports
  artifacts:
    paths:
      - public
  only:
   - master
   - develop
